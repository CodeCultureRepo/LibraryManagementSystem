<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <!-- Header Section -->
    <header>
        <img src="LMS_image.jpg" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="catalog.html">Catalog</a>
            <a href="account.html">My Account</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>
    <h2>Admin Login</h2>
    <form onsubmit="redirectToDashboard(event)">
        <label for="admin_username">Username:</label>
        <input type="text" id="admin_username" name="admin_username" required><br>
        <label for="admin_password">Password:</label>
        <input type="password" id="admin_password" name="admin_password" required><br>
        <button type="submit">Login</button>
    </form>
    <script>
        // Redirect function to handle login button click
        function redirectToDashboard(event) {
            event.preventDefault(); // Prevents the form from submitting
            window.location.href = 'admin_dashboard.html'; // Navigates to the dashboard
        }
    </script>
</body>
</html>
